<style>
/* Layout: one-screen app. Toolbar row + tab row on top (or bottom), infinite canvas fills the rest. */
:root{
  --chrome:#22252c; --chrome2:#2b2f38; --chrome3:#353a45; --line:#3d4350;
  --ink:#eceef3; --mute:#9ba3b3; --accent:#5aa2ff; --accent-bg:rgba(90,162,255,.18);
  --danger:#ff6b5e; --ok:#55c27a;
  --ui:"Nanum Gothic",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--chrome);color:var(--ink);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#app.bottom{flex-direction:column-reverse}
#chrome{background:var(--chrome);border-bottom:1px solid var(--line);flex:none;
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#app.bottom #chrome{border-bottom:0;border-top:1px solid var(--line);padding-top:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#bar{display:flex;align-items:center;gap:2px;padding:5px 8px;overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.sep{width:1px;height:26px;background:var(--line);margin:0 3px;flex:none}
.tb{flex:none;width:37px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative;padding:0;font:inherit}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb:active{background:var(--chrome3)}
.tb.on{background:var(--accent-bg);color:var(--accent)}
.tb.mod{width:auto;min-width:38px;padding:0 7px;font-size:13px;font-weight:700;color:var(--mute);border:1px solid var(--line)}
.tb.mod.on{color:#0f1420;background:var(--accent);border-color:var(--accent)}
.tb:focus-visible,.btn:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sw{flex:none;width:27px;height:27px;border-radius:50%;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line);margin:0 2px;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent);border-color:var(--chrome)}
#wdot{width:37px;height:40px}
#wdot i{display:block;border-radius:50%;background:var(--ink)}
#tabs{display:flex;align-items:stretch;gap:2px;padding:0 8px 0;overflow-x:auto;scrollbar-width:none;height:34px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;max-width:220px;padding:0 6px 0 12px;border-radius:8px 8px 0 0;background:transparent;color:var(--mute);font-size:13px;cursor:pointer;border:0;font-family:var(--ui)}
#app.bottom .tab{border-radius:0 0 8px 8px}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{background:var(--chrome2);color:var(--ink)}
.tab .x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--mute);font-size:15px;line-height:1}
.tab .x:active{background:var(--chrome3)}
.tab.add{padding:0 12px;font-size:18px}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
/* popovers & sheets */
.pop{position:fixed;z-index:30;background:var(--chrome2);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:14px;min-width:240px;max-width:min(92vw,380px);color:var(--ink)}
.pop h3{margin:0 0 10px;font-size:14px;font-weight:800;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.row label{font-size:13px;color:var(--mute);min-width:64px}
.seg{display:inline-flex;background:var(--chrome);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mute);padding:7px 11px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--chrome3);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--chrome3);color:var(--ink);border-radius:9px;padding:9px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#0d1320}
.btn.dan{color:var(--danger)}
.btn:active{filter:brightness(1.15)}
input[type=range]{width:180px;accent-color:var(--accent)}
input[type=number],input[type=text],textarea{background:var(--chrome);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:15px;-webkit-user-select:text;user-select:text}
input[type=number]{width:72px}
textarea{width:100%;box-sizing:border-box;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:15px}
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(8,10,14,.5);display:grid;place-items:center;padding:16px}
.modal{background:var(--chrome2);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{margin:0 0 12px;font-size:17px;font-weight:800}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--mute);line-height:1.55}
.preview{background:#fff;color:#111;border-radius:10px;min-height:48px;padding:10px;margin-top:10px;overflow:auto}
.preview svg{max-width:100%}
#drawer{position:fixed;z-index:35;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--chrome2);border-right:1px solid var(--line);box-shadow:10px 0 40px rgba(0,0,0,.4);
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;transform:translateX(-105%);transition:transform .22s ease}
#drawer.open{transform:none}
#drawer .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#notes{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:0 -4px;padding:0 4px}
.note{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--chrome);cursor:pointer}
.note.on{outline:2px solid var(--accent)}
.note .nm{flex:1;min-width:0}
.note .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .nm small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.note button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:12px;padding:6px;border-radius:6px;cursor:pointer}
.note button.dan{color:var(--danger)}
#selbar{position:fixed;z-index:25;display:flex;gap:2px;background:var(--chrome2);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#selbar button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
#selbar button:active{background:var(--chrome3)}
#selbar button.dan{color:var(--danger)}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,22,28,.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
#zoomlbl{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:#8a93a3;background:rgba(30,33,40,.75);padding:4px 9px;border-radius:999px;pointer-events:auto;cursor:pointer;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.keys kbd{font-family:ui-monospace,Menlo,monospace;background:var(--chrome);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap;justify-self:start}
.colors-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}
.colors-grid button{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);cursor:pointer;padding:0}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:10px;padding:8px 4px;font:inherit;font-size:12px;cursor:pointer}
.stgrid button:active{background:var(--chrome3)}
.stgrid svg{width:40px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sthead{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.06em;margin:10px 0 6px}
#app.split{right:calc(100% - var(--sp,50%))}
#pane2{position:fixed;top:0;left:var(--sp,50%);width:calc(100% - var(--sp,50%));height:100%;border:0;background:var(--chrome);z-index:5}
#divider{position:fixed;top:0;bottom:0;left:var(--sp,50%);width:14px;margin-left:-7px;z-index:6;cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
#divider::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--line)}
#divider i{position:relative;width:6px;height:44px;border-radius:3px;background:var(--mute)}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
</style>

      <button class="tb" data-tool="laser" title="레이저 포인터 (P)" aria-label="레이저 포인터"><svg viewBox="0 0 24 24"><path d="M3.5 20.5l8-8"/><path d="M9.6 10.6l3.8 3.8M10.5 9.7l2.9-2.9 3.8 3.8-2.9 2.9z"/><circle cx="19.3" cy="4.7" r="2.1" fill="#ff4d4d" stroke="#ff4d4d"/><path d="M19.3 9.2v1.3M14.8 4.7h-1.3" stroke="#ff4d4d"/></svg></button>

      <div class="sep"></div>
      <div id="swatches" style="display:flex;align-items:center"></div>

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg-full.js"></script>
<script>
(()=>{
'use strict';
const PRISTINE='<!doctype html>'+document.documentElement.outerHTML;
const IS_PANE2=window.name==='sajd-pane2';
const KEY=k=>IS_PANE2?'p2.'+k:k;
/* ================================================================ utils */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function pip(x,y,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins}return ins}
function hexRgb(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]}
function rgbHex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function lum(h){const[r,g,b]=hexRgb(h);return(0.2126*r+0.7152*g+0.0722*b)/255}
const LS=(k,v)=>{try{if(v===undefined){const r=localStorage.getItem('sajd.'+k);return r==null?null:JSON.parse(r)}localStorage.setItem('sajd.'+k,JSON.stringify(v))}catch(e){return null}};
let _id=0;const nid=()=>Date.now().toString(36)+'-'+(++_id).toString(36)+Math.random().toString(36).slice(2,5);
function toast(msg,ms=1600){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms)}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)&&loadScript.done[src])return res();const s=document.createElement('script');s.src=src;s.onload=()=>{loadScript.done[src]=1;res()};s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
loadScript.done={};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ================================================================ settings */
const DEF_COLORS=['#0f172a','#006fff','#ed3624','#fa9d00','#ffff00','#60ba46','#a400c7','#cccac9'];
const st=Object.assign({tool:'pen',ci:0,colors:DEF_COLORS.slice(),pen:3,dash:3,hl:20,er:16,grid:false,board:'paper',finger:false,
  eraserMode:'object',lassoMode:'free',laserDur:1,barPos:'top',gridSize:40,hold:true},LS('settings')||{});
if(!Array.isArray(st.colors)||st.colors.length!==8)st.colors=DEF_COLORS.slice();
const saveSettings=()=>LS('settings',st);

  board:{bg:'#1e2a26',g1:'rgba(255,255,255,.07)',g2:'rgba(255,255,255,.16)',dark:true,label:'칠판'},black:{bg:'#17191e',g1:'rgba(255,255,255,.06)',g2:'rgba(255,255,255,.15)',dark:true,label:'검정'}};

/* ================================================================ expression parser (graphs) */
function compileExpr(src){

    log:x=>Math.log10(x),ln:Math.log,floor:Math.floor,ceil:Math.ceil,sgn:Math.sign,sec:x=>1/Math.cos(x),csc:x=>1/Math.sin(x),cot:x=>1/Math.tan(x)};

/* ================================================================ text & LaTeX rendering */
const RS=3; // raster scale for text
const textCache=new Map();

    out.push(line)}return out}

function eraseAt(work,x,y,r){

  for(const o of work){if(!hitObj(o,x,y,r)){out.push(o);continue}
    if(st.eraserMode==='pixel'&&o.t==='stroke'&&!o.fill){const p=o.p;let cur=[];const pieces=[];
      for(let i=0;i<p.length;i+=3){if(dist(p[i],p[i+1],x,y)<=r+o.w/2){if(cur.length>=3)pieces.push(cur);cur=[]}else cur.push(p[i],p[i+1],p[i+2])}

      pieces.forEach(pp=>out.push({...o,id:nid(),p:pp}));changed=true}

      <label style="min-width:0"><input type="checkbox" id="tb" ${obj&&obj.bold?'checked':''}> 굵게</label></div>

    prev.hidden=mode!=='1';if(mode==='1'){prev.innerHTML='';if(window.MathJax&&MathJax.tex2svg){tx.value.split('\n').forEach(l=>{const d=document.createElement('div');d.style.margin='4px 0';d.appendChild(latexToSvgEl(latexLine(l,m.querySelector('#tb').checked)));prev.appendChild(d)})}else prev.textContent='수식 엔진을 불러오는 중…'}};
  bindSeg(m,'tm',v=>{mode=v;upd()});tx.oninput=upd;m.querySelector('#tb').onchange=upd;
  m.querySelector('#tfs').oninput=e=>m.querySelector('#tfsv').textContent=e.target.value;upd();try{tx.focus()}catch(_){}setTimeout(()=>tx.focus(),60);
  m.querySelector('#tcan').onclick=()=>m.remove();

  const ok=()=>{const s=tx.value.replace(/\s+$/,'');m.remove();if(!s){if(obj){commit(doc.objs.filter(o=>o.id!==obj.id));sel=[];hideSelbar()}return}
    const props={s,latex:mode==='1',fs:+m.querySelector('#tfs').value,bold:m.querySelector('#tb').checked};
    if(obj){const n={...obj,...props};commit(doc.objs.map(o=>o.id===obj.id?n:o),true);showSelbar()}
    else{const o={id:nid(),t:'text',x:pos[0],y:pos[1]-props.fs*0.7,w:Math.max(200,W*0.6/view().s),c:st.colors[st.ci],...props};commit(doc.objs.concat(o))}};
  m.querySelector('#tok').onclick=ok;tx.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();ok()}if(e.key==='Escape')m.remove()})}

const IDB={db:null,ok:true,
  open(){return new Promise(res=>{try{const r=indexedDB.open('sajd-math-note',1);r.onupgradeneeded=()=>{r.result.createObjectStore('notes',{keyPath:'id'})};r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>{this.ok=false;res(false)}}catch(e){this.ok=false;res(false)}})},
  tx(mode){return this.db.transaction('notes',mode).objectStore('notes')},
  put(n){return new Promise(res=>{if(!this.db)return res(false);try{const q=this.tx('readwrite').put(n);q.onsuccess=()=>res(true);q.onerror=()=>res(false)}catch(e){res(false)}})},
  get(id){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.tx('readonly').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}

function renderToCanvas(objs,b,scale,bgColor){const w=Math.max(1,Math.ceil((b.x2-b.x1)*scale)),h=Math.max(1,Math.ceil((b.y2-b.y1)*scale));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');
  c.fillStyle=bgColor;c.fillRect(0,0,w,h);c.setTransform(scale,0,0,scale,-b.x1*scale,-b.y1*scale);objs.forEach(o=>drawObj(c,o));return cv}

async function exportPNG(){const e=exportBounds();if(!e)return;const maxDim=Math.max(e.b.x2-e.b.x1,e.b.y2-e.b.y1);const scale=Math.min(2,7000/maxDim);
  const cv=renderToCanvas(e.objs,e.b,scale,BOARDS[st.board].bg);try{cv.toBlob(b=>{if(b)deliver(b,safeName(doc.name)+'.png');else toast('PNG를 만들 수 없어요')},'image/png')}catch(err){toast('PNG를 만들 수 없어요')}}
async function exportPDF(){const e=exportBounds();if(!e)return;toast('PDF 만드는 중…',3000);
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');const{jsPDF}=window.jspdf;
    // page = imported PDF pages if present, otherwise one page per A4-width slice of the content
    const pageW=e.b.x2-e.b.x1;const sliceH=pageW*1.4142;const pages=[];for(let y=e.b.y1;y<e.b.y2;y+=sliceH)pages.push({x1:e.b.x1,x2:e.b.x2,y1:y,y2:Math.min(e.b.y2,y+sliceH)});
    let pdf=null;for(const pb of pages){const scale=Math.min(2,4000/pageW);const cv=renderToCanvas(e.objs.filter(o=>{const b=bbox(o);return!(b.y2<pb.y1||b.y1>pb.y2)}),pb,scale,BOARDS[st.board].bg);
      const wpt=595.28,hpt=wpt*(pb.y2-pb.y1)/pageW;if(!pdf)pdf=new jsPDF({unit:'pt',format:[wpt,hpt],orientation:hpt>wpt?'p':'l'});else pdf.addPage([wpt,hpt],hpt>wpt?'p':'l');
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,wpt,hpt)}
    deliver(pdf.output('blob'),safeName(doc.name)+'.pdf')}catch(err){toast('PDF를 만들 수 없어요 (인터넷 연결 확인)',2600)}}

async function downscale(dataUrl,maxDim){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxDim/Math.max(im.width,im.height));if(k>=1&&dataUrl.length<3e6)return res({src:dataUrl,w:im.width,h:im.height});
  const cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res({src:cv.toDataURL('image/jpeg',0.88),w:cv.width,h:cv.height})};im.onerror=()=>res(null);im.src=dataUrl})}
async function insertImageFile(f){const d=await downscale(await fileToDataURL(f),2400);if(!d){toast('이미지를 열 수 없어요');return}const v=view();const maxW=W*0.7/v.s;const k=Math.min(1,maxW/d.w);const[cx,cy]=viewCenter();

  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;const N=Math.min(pdf.numPages,80);if(pdf.numPages>80)toast('앞 80쪽만 불러와요',2500);
    const v=view();const pageW=900;let y=v.y+40/v.s;const x=viewCenter()[0]-pageW/2;const imgs=[];
    for(let i=1;i<=N;i++){const pg=await pdf.getPage(i);const vp1=pg.getViewport({scale:1});const k=pageW/vp1.width;const rs=Math.min(2.2,2400/vp1.width);const vp=pg.getViewport({scale:rs});
      const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);

function insertStencil(kind,n){
  const[cx,cy]=viewCenter();const S=st.gridSize*3;const c=st.colors[st.ci];const w=Math.max(2,st.pen);const out=[];
  const T=(x,y)=>[cx+x,cy+y];
  const L=(a,b,o={})=>out.push({id:nid(),t:'shape',k:'line',cp:[T(...a),T(...b)],w,c,...o});

  const PG=(pts,o={})=>out.push({id:nid(),t:'shape',k:'poly',cp:pts.map(p=>T(...p)),w,c,...o});
  const E=(x1,y1,x2,y2,o={})=>out.push({id:nid(),t:'shape',k:'ellipse',cp:[T(x1,y1),T(x2,y2)],w,c,...o});
  const X=(x,y,tex,fs=22)=>out.push({id:nid(),t:'text',x:cx+x,y:cy+y,w:0,fs,c,s:'$'+tex+'$',latex:true,bold:false});
  const D={dash:true};const A={arrow:true};
  const curve=(f,a,b,N=120)=>{const r=[];for(let i=0;i<=N;i++){const t=a+(b-a)*i/N;r.push(f(t))}return r};
  const axes=(x1,x2,y1,y2)=>{L([x1,0],[x2,0],A);L([0,y2],[0,y1],A);X(x2-4,6,'x');X(10,y1-12,'y');X(-24,4,'O')};
  switch(kind){
    case'axes2d':axes(-S*1.5,S*1.5,-S*1.2,S*1.2);break;
    case'unit':{const R=S;axes(-R*1.45,R*1.45,-R*1.35,R*1.35);E(-R,-R,R,R);X(R+5,4,'1',18);X(-R-26,4,'-1',18);X(8,-R-26,'1',18);X(8,R+2,'-1',18);break}
    case'sector':{const r=S*1.5,ox=-r/2,oy=r*0.35,th=Math.PI/3;L([ox,oy],[ox+r,oy]);L([ox,oy],[ox+r*Math.cos(th),oy-r*Math.sin(th)]);
      P(curve(t=>[ox+r*Math.cos(t),oy-r*Math.sin(t)],0,th,40));P(curve(t=>[ox+r*0.22*Math.cos(t),oy-r*0.22*Math.sin(t)],0,th,16),{w:w*0.7});
      X(ox+r*0.27,oy-r*0.2,'\\theta',20);X(ox+r*0.45,oy+4,'r',20);out.push({id:nid(),t:'dot',x:cx+ox,y:cy+oy,r:w*1.4,c});break}
    case'hyper':{const a=S*0.55,b=S*0.42,E2=S*1.5;axes(-E2,E2,-S*1.2,S*1.2);
      P(curve(t=>[a*Math.cosh(t),b*Math.sinh(t)],-1.75,1.75));P(curve(t=>[-a*Math.cosh(t),b*Math.sinh(t)],-1.75,1.75));
      const k=b/a,xe=S*1.2/k>E2?E2:S*1.2/k;L([-xe,k*xe],[xe,-k*xe],D);L([-xe,-k*xe],[xe,k*xe],D);break}
    case'sin':case'cos':{const kx=S*2.6/(2*Math.PI),A0=S*0.6,f=kind==='sin'?Math.sin:Math.cos;L([-S*0.3,0],[S*2.9,0],A);L([0,S*0.95],[0,-S*0.95],A);
      P(curve(t=>[t*kx,-A0*f(t)],0,2*Math.PI,160));X(S*2.9-4,6,'x');X(10,-S*0.95-12,'y');X(-24,4,'O');
      [[Math.PI/2,'\\frac{\\pi}{2}'],[Math.PI,'\\pi'],[1.5*Math.PI,'\\frac{3}{2}\\pi'],[2*Math.PI,'2\\pi']].forEach(([v,l])=>{L([v*kx,-5],[v*kx,5],{w:w*0.7});X(v*kx-10,8,l,16)});
      L([-5,-A0],[5,-A0],{w:w*0.7});X(-22,-A0-10,'1',16);L([-5,A0],[5,A0],{w:w*0.7});X(-30,A0-10,'-1',16);
      L([0,-A0],[2*Math.PI*kx,-A0],{...D,w:w*0.6});L([0,A0],[2*Math.PI*kx,A0],{...D,w:w*0.6});break}
    case'tan':{const kx=S*2.6/(2*Math.PI),A0=S*0.45,Y=S*1.05;L([-S*0.3,0],[S*2.9,0],A);L([0,Y],[0,-Y],A);X(S*2.9-4,6,'x');X(10,-Y-12,'y');X(-24,4,'O');
      [[0,Math.PI/2],[Math.PI/2,1.5*Math.PI],[1.5*Math.PI,2*Math.PI]].forEach(([a,b])=>{const pts=[];for(let i=0;i<=120;i++){const t=a+(b-a)*i/120;const y=-A0*Math.tan(t);if(Math.abs(y)<=Y)pts.push([t*kx,y])}if(pts.length>1)P(pts)});
      [Math.PI/2,1.5*Math.PI].forEach(v=>L([v*kx,-Y],[v*kx,Y],{...D,w:w*0.6}));[[Math.PI/2,'\\frac{\\pi}{2}'],[Math.PI,'\\pi'],[1.5*Math.PI,'\\frac{3}{2}\\pi'],[2*Math.PI,'2\\pi']].forEach(([v,l])=>X(v*kx+4,8,l,16));break}
    case'normal':{const sg=S*0.45,H=S*1.1;L([-sg*3.4,0],[sg*3.4,0],A);P(curve(t=>[t,-H*Math.exp(-t*t/(2*sg*sg))],-sg*3.2,sg*3.2,140));L([0,0],[0,-H],{...D,w:w*0.7});X(-8,6,'m',20);X(sg*3.4-4,6,'x');break}
    case'ngon':{const R=S*0.95,off=-Math.PI/2+(n%2?0:Math.PI/n);PG(Array.from({length:n},(_,i)=>[R*Math.cos(off+2*Math.PI*i/n),R*Math.sin(off+2*Math.PI*i/n)]));break}
    case'axes3d':{const s=S*1.3;L([0,0],[0,-s],A);L([0,0],[s*1.3,0],A);L([0,0],[-s*0.75,s*0.6],A);L([0,0],[0,s*0.35],D);L([0,0],[-s*0.45,0],D);L([0,0],[s*0.35,-s*0.28],D);
      X(10,-s-14,'z');X(s*1.3-6,8,'y');X(-s*0.75-24,s*0.6-6,'x');X(-26,6,'O');break}
    case'sphere':{const R=S,ry=R*0.28;E(-R,-R,R,R);P(curve(t=>[R*Math.cos(t),ry*Math.sin(t)],0,Math.PI,60));P(curve(t=>[R*Math.cos(t),-ry*Math.sin(t)],0,Math.PI,60),D);
      out.push({id:nid(),t:'dot',x:cx,y:cy,r:w*1.3,c});L([0,0],[R,0],{...D,w:w*0.7});X(R*0.45,-26,'r',20);break}
    case'hemi':{const R=S*1.1,ry=R*0.3,b=R*0.35;P(curve(t=>[R*Math.cos(t),b-R*Math.sin(t)],0,Math.PI,80));P(curve(t=>[R*Math.cos(t),b+ry*Math.sin(t)],0,Math.PI,60));P(curve(t=>[R*Math.cos(t),b-ry*Math.sin(t)],0,Math.PI,60),D);break}
    case'tetra':{const R=S*1.1,Ap=[-R,R*0.55],Bp=[R,R*0.55],Cp=[R*0.3,R*0.05],Dp=[-R*0.05,-R*1.2];L(Ap,Bp);L(Ap,Dp);L(Bp,Dp);L(Ap,Cp,D);L(Bp,Cp,D);L(Cp,Dp,D);
      X(Ap[0]-24,Ap[1]-4,'A',20);X(Bp[0]+6,Bp[1]-4,'B',20);X(Cp[0]+6,Cp[1]-26,'C',20);X(Dp[0]-8,Dp[1]-32,'D',20);break}
    case'pyramid':{const R=S,d=[R*0.55,-R*0.42],Ap=[-R*1.05,R*0.6],Bp=[R*0.65,R*0.6],Cp=[Bp[0]+d[0],Bp[1]+d[1]],Dp=[Ap[0]+d[0],Ap[1]+d[1]],V=[R*0.05,-R*1.25];
      L(Ap,Bp);L(Bp,Cp);L(V,Ap);L(V,Bp);L(V,Cp);L(Ap,Dp,D);L(Dp,Cp,D);L(V,Dp,D);X(V[0]-6,V[1]-32,'O',20);break}
    case'prism':{const R=S,H=R*1.4,d=[R*0.45,-R*0.38],Ap=[-R,H/2+R*0.2],Bp=[R*0.7,H/2+R*0.2],Cp=[Ap[0]+d[0]+R*0.25,Ap[1]+d[1]];
      const up=p=>[p[0],p[1]-H];L(Ap,Bp);L(up(Ap),up(Bp));L(up(Bp),up(Cp));L(up(Cp),up(Ap));L(Ap,up(Ap));L(Bp,up(Bp));L(Ap,Cp,D);L(Bp,Cp,D);L(Cp,up(Cp),D);break}
  }
  if(!out.length)return;commit(doc.objs.concat(out));setTool('lasso',true);setSel(out.map(o=>o.id));toast('스텐실을 넣었어요',1100)}

/* ================================================================ split view (two notes side by side) */
function otherPaneNote(){if(IS_PANE2)return LS('current');return $('#pane2')?LS('p2.current'):null}
async function openSplit(){if($('#pane2'))return;await saveNow();closeAll();
  const fr=document.createElement('iframe');fr.id='pane2';fr.name='sajd-pane2';fr.title='오른쪽 화면';fr.srcdoc=PRISTINE;
  const dv=document.createElement('div');dv.id='divider';dv.innerHTML='<i></i>';document.body.append(fr,dv);$('#app').classList.add('split');$('#bSplit').classList.add('on');
  let drag=false;dv.addEventListener('pointerdown',e=>{drag=true;dv.setPointerCapture(e.pointerId);fr.style.pointerEvents='none'});
  dv.addEventListener('pointermove',e=>{if(!drag)return;const pct=clamp(e.clientX/window.innerWidth*100,25,75);document.documentElement.style.setProperty('--sp',pct+'%')});
  const end=()=>{drag=false;fr.style.pointerEvents='';LS('splitPos',document.documentElement.style.getPropertyValue('--sp'))};dv.addEventListener('pointerup',end);dv.addEventListener('pointercancel',end);
  const sp=LS('splitPos');if(sp)document.documentElement.style.setProperty('--sp',sp);LS('split',1);setTimeout(resize,30)}
async function closeSplit(){const fr=$('#pane2');if(!fr)return;try{fr.contentWindow.postMessage('sajd-save','*')}catch(e){}await new Promise(r=>setTimeout(r,250));fr.remove();$('#divider')?.remove();$('#app').classList.remove('split');$('#bSplit').classList.remove('on');LS('split',0);setTimeout(resize,30)}
$('#bSplit').addEventListener('click',()=>{if(IS_PANE2){window.parent.postMessage('sajd-close-split','*');return}$('#pane2')?closeSplit():openSplit()});
window.addEventListener('message',e=>{if(e.data==='sajd-close-split'&&!IS_PANE2)closeSplit();if(e.data==='sajd-save')saveNow()});

/* ================================================================ boot */
function sampleDoc(){const d=newDoc('시작하기');const C=st.colors;
  d.objs=[{id:nid(),t:'text',x:0,y:0,w:700,fs:30,c:C[0],s:'SAJD Math Note — 아이패드판',bold:true,latex:false},
    {id:nid(),t:'text',x:0,y:52,w:720,fs:19,c:C[0],s:'Apple Pencil로 쓰고, 손가락으로 화면을 움직이세요. 두 손가락 탭은 실행취소.\n선을 그은 뒤 펜을 떼지 않고 잠깐 멈추면 도형으로 바뀌어요.',latex:false},
    {id:nid(),t:'text',x:0,y:140,w:0,fs:26,c:C[1],s:'근의 공식 $x=\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}$',latex:true},
    {id:nid(),t:'graph',x:120+5*40,y:250+5*40,u:40,xr:[-3,6],yr:[-3,5],fns:[{e:'y=(x-2)^2-1',c:C[2],tr:[0,6.2832]}],c:C[0]},
    {id:nid(),t:'shape',k:'rect',cp:[[560,260],[760,260],[760,400],[560,400]],w:3,c:C[5]},
    {id:nid(),t:'shape',k:'line',cp:[[560,460],[800,460]],w:3,c:C[6]},
    ...[1,2,3].map(i=>({id:nid(),t:'dot',x:560+60*i,y:460,r:4.5,c:C[6]})),
    {id:nid(),t:'text',x:560,y:476,w:300,fs:16,c:C[6],s:'선분 4등분 (올가미로 선택 → n등분)',latex:false}];
  d.view={x:-60,y:-60,s:1};return d}
async function boot(){
  $('#app').classList.toggle('bottom',st.barPos==='bottom');renderSwatches();setTool(st.tool==='eyedrop'?'pen':st.tool,true);$('#bGrid').classList.toggle('on',st.grid);
  resize();window.addEventListener('resize',()=>{resize();showSelbar()});
  if(window.ResizeObserver)new ResizeObserver(()=>{resize()}).observe(stage);
  if(IS_PANE2){const b=$('#bSplit');b.title='분할 닫기';b.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'}
  if(window.visualViewport)visualViewport.addEventListener('resize',()=>setTimeout(resize,50));
  await IDB.open();
  let cur=LS(KEY('current'));if(cur&&cur===otherPaneNote())cur=null;let d=cur?await getNote(cur):null;
  if(!d){const list=await allNotes();d=list.find(n=>n.id!==otherPaneNote())||null}
  if(!d){d=sampleDoc();if(LS('seenSample'))d=newDoc(nextName());LS('seenSample',1)}
  setDoc(structuredCloneSafe(d));await saveNow();renderTabs();requestAnimationFrame(frame);
  if(!IS_PANE2&&LS('split'))openSplit();
  if(document.fonts&&document.fonts.load)document.fonts.load('400 20px "Nanum Gothic"').then(()=>{textCache.clear();bbC=new WeakMap();dirtyBase()}).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',()=>saveNow())}
boot();
})();
